    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#375dfb"/><stop offset="1" stop-color="#7948ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#263a70" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1040" cy="94" r="96" fill="#fff" opacity=".46"/>
  <circle cx="100" cy="760" r="140" fill="#fff" opacity=".34"/>
